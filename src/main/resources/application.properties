# --- Application ---
spring.application.name=Land Title Risk Scorer

# Bind to whatever port the host assigns (Railway, Render, Fly and most other
# platforms inject $PORT), falling back to 8080 when running locally.
server.port=${PORT:8080}

# Spring hides the exception message from JSON error responses by default
# (to avoid leaking internals). The "Add a property" form and the auth forms
# surface these messages to the user, so it's turned back on. Every message
# reaching a client is one we wrote deliberately in a ResponseStatusException.
server.error.include-message=always

# --- H2 in-memory database ---
# A fresh in-memory DB is created on every startup and repopulated by DataSeeder,
# so there is nothing to configure or install to run this project.
spring.datasource.url=jdbc:h2:mem:titleriskdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate create the schema from the @Entity classes on each run.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- H2 web console: OFF by default, deliberately ---
# The console allows arbitrary SQL against the database and this app ships with
# a blank H2 password, so exposing it on a public deployment would let anyone
# read every user's password hash or drop the tables. It is therefore disabled
# here and switched on only by the local "dev" profile:
#
#     mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=dev
#
# See application-dev.properties.
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
