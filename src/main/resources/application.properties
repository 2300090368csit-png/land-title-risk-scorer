# --- Application ---
spring.application.name=Land Title Risk Scorer
server.port=8080

# Spring hides the exception message from JSON error responses by default
# (to avoid leaking internals). This is a local demo with no sensitive data,
# and the "Add a property" form's validation messages rely on it being
# visible, so it's turned back on.
server.error.include-message=always

# --- H2 in-memory database ---
# A fresh in-memory DB is created on every startup and repopulated by DataSeeder,
# so there is nothing to configure or install to run this project.
spring.datasource.url=jdbc:h2:mem:titleriskdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate create the schema from the @Entity classes on each run.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 web console, handy for poking at the seeded data during a demo:
# http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:titleriskdb)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
