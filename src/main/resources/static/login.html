<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in — Land Title Risk Scorer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <span class="app-nav-mark">LT</span>
            Land Title Risk Scorer
        </div>

        <h1>Sign in</h1>
        <p class="sub">Access the property risk dashboard.</p>

        <p class="form-error" id="form-error" hidden></p>

        <form id="login-form" novalidate>
            <div class="field-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" required>
            </div>
            <div class="field-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Sign in</button>
        </form>

        <div class="auth-demo">
            Demo account &mdash; <code>demo</code> / <code>demo1234</code>
        </div>

        <p class="auth-switch">New here? <a href="register.html">Create an account</a></p>
    </div>

    <p class="auth-foot">Sample data is fictional. Built by Arza Sriram.</p>
</main>

<script src="js/common.js"></script>
<script src="js/login.js"></script>
</body>
</html>
