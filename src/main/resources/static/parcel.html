<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Property — Land Title Risk Scorer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app-nav"></div>

<main>
    <a class="back-link" href="dashboard.html">&larr; All properties</a>

    <div class="page-head">
        <div>
            <h1 id="page-title">Loading&hellip;</h1>
            <p id="page-sub"></p>
        </div>
    </div>

    <div class="detail-grid">
        <div class="panel score-panel">
            <div class="gauge-wrap">
                <div id="gauge-svg-slot"></div>
                <div class="gauge-center">
                    <div class="num" id="gauge-number">&ndash;</div>
                    <div class="out-of">Risk score</div>
                </div>
            </div>
            <span class="score-pill" id="band-label">&ndash;</span>
            <p class="verdict-text" id="verdict-text"></p>
            <p class="cap-note" id="cap-note" hidden></p>
        </div>

        <div class="panel">
            <h2>Property record</h2>
            <div class="facts" id="facts"></div>
        </div>
    </div>

    <section>
        <h2>How the score breaks down</h2>
        <div class="panel">
            <div class="contribution-bar" id="contribution-bar"></div>
            <div class="contribution-legend" id="contribution-legend"></div>
        </div>
    </section>

    <section>
        <h2>The five checks</h2>
        <div class="factor-list" id="factor-cards"></div>
    </section>
</main>

<footer>Rule-based scoring across 5 weighted factors — no ML, fully explainable. Sample data is fictional.</footer>

<script src="js/common.js"></script>
<script src="js/detail.js"></script>
</body>
</html>
