# Local development profile. Activate with:
#
#     mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=dev      (Windows)
#     ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev        (Mac/Linux)
#
# The only thing this changes is turning the H2 console back on, which is
# unsafe on a public deployment (arbitrary SQL, blank database password) but
# genuinely useful when you're poking at seeded data on your own machine.
#
#     http://localhost:8080/h2-console
#     JDBC URL: jdbc:h2:mem:titleriskdb   user: sa   password: (blank)
spring.h2.console.enabled=true
